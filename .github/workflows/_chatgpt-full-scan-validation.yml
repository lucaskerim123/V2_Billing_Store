name: Temporary Full Scan Validation
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: temporary-full-scan-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Initialize CodeQL scan without Code Scanning upload
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Run CodeQL scan without Code Scanning upload
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript-validation"
          upload: never
          output: codeql-results
      - name: Verify CodeQL result artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -d codeql-results
          find codeql-results -type f -name '*.sarif' -print -quit | grep -q .
      - name: Run complete production preflight
        run: npm run preflight
