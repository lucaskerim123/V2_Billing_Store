name: Billing Store API Repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flatten legacy license routes and repair Master paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('src/app/api/license')
          legacy = root / 'v1'
          if legacy.exists():
              for child in legacy.iterdir():
                  target = root / child.name
                  if target.exists():
                      if target.is_dir(): shutil.rmtree(target)
                      else: target.unlink()
                  if child.is_dir(): shutil.copytree(child, target)
                  else: shutil.copy2(child, target)
              shutil.rmtree(legacy)
          # The License Master public contract is /api/*.
          for base in [Path('src'), Path('docs'), Path('scripts')]:
              if not base.exists(): continue
              for p in base.rglob('*'):
                  if not p.is_file() or any(x in p.parts for x in ('node_modules','.next','.git')): continue
                  try: s=p.read_text()
                  except Exception: continue
                  ns=s.replace('/api/v1/','/api/')
                  ns=ns.replace('/api/v1"','/api"').replace("/api/v1'", "/api'")
                  if p.as_posix().endswith('/src/lib/master-api.ts'):
                      ns=ns.replace('masterRequest("/health"','masterRequest("/api/health"')
                      ns=ns.replace("masterRequest('/health'", "masterRequest('/api/health'")
                  if ns!=s: p.write_text(ns)
          PY
          # Do not leave wrappers pointing back into a removed v1 directory.
          grep -RInE '/api/v[0-9]+/|/v1/' src docs scripts --exclude-dir=node_modules --exclude-dir=.next || true
      - name: Typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit repaired Store and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src docs scripts
          git rm -f .github/workflows/api-repair.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix License Master API integration and remove legacy v1 routes'
          git push
