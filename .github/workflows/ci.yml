name: Store CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify complete repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -f package-lock.json
          test -f vercel.json
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Run complete production preflight
        run: npm run preflight
      - name: Upload temporary validation failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-failure-${{ github.sha }}
          path: .orbitfs-validation/validation-error.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Production gate passed
        run: 'echo "CI production gate passed: install, integrity, lint, typecheck, audit, and production build are green."'
