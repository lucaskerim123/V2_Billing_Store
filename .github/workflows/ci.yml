name: Store Full Scan

on:
  push:
    branches: [Special-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: read

concurrency:
  group: store-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-gate:
    name: Full Production Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify complete repository
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test -f package-lock.json
          test -f vercel.json

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify immutable database migration baseline
        run: node scripts/prepare-supabase-migrations.mjs .orbitfs-supabase/supabase/migrations

      - name: Install dependencies
        run: npm ci

      - name: Verify product groups and product-independent storefront
        run: npm run test:product-store-groups

      - name: Verify product-independent licensing contracts
        run: npm run test:product-agnostic

      - name: Verify Base updater component selection
        run: |
          node --test scripts/orbitfs-update-targets.test.mjs
          node --test scripts/base-update-patches.test.mjs

      - name: Verify Master Database Update readiness and package provenance
        run: npm run test:update-master-database-readiness

      - name: Run complete production preflight
        run: npm run preflight
