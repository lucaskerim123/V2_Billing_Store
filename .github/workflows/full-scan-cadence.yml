name: Store Scan Cadence

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/**"

permissions:
  actions: read
  contents: read

concurrency:
  group: store-scan-cadence-main
  cancel-in-progress: false

jobs:
  cadence:
    name: Check scan cadence
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.cadence.outputs.due }}
    steps:
      - name: Checkout commit history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run full scan after five meaningful commits
        id: cadence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          runs="$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&per_page=10")"
          baseline=""

          while IFS=$'\t' read -r id sha conclusion; do
            [ -n "$id" ] || continue
            if [ "$conclusion" = "success" ]; then
              baseline="$sha"
              break
            fi

            jobs="$(curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$id/jobs?per_page=100")"
            passed="$(printf '%s' "$jobs" | jq '[.jobs[].steps[]? | select(.name == "Full scan passed" and .conclusion == "success")] | length')"
            if [ "$passed" -gt 0 ]; then
              baseline="$sha"
              break
            fi
          done < <(printf '%s' "$runs" | jq -r '.workflow_runs[] | [.id, .head_sha, (.conclusion // "")] | @tsv')

          if [ -z "$baseline" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "No completed Full Scan baseline exists; a scan is due."
            exit 0
          fi

          if ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Full Scan baseline $baseline is outside local history; a scan is due."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$baseline" "$GITHUB_SHA"; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Full Scan baseline is not an ancestor of current main; a scan is due."
            exit 0
          fi

          count="$(git rev-list --count "$baseline..$GITHUB_SHA" -- . ':(exclude).github/workflows/**')"
          echo "Meaningful commits since Full Scan baseline $baseline: $count"

          if [ "$count" -ge 5 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Full scan is due after $count meaningful commits."
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            echo "Skipping heavy Full Scan until 5 meaningful commits accumulate."
          fi

  full-scan:
    name: Scheduled full scan
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    uses: ./.github/workflows/ci.yml
    secrets: inherit
