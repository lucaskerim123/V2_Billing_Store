name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-billing-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID || 'team_W3fS0X03YCjNkD2BoqRj6Uld' }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID || 'prj_3ARdg4cRikU2OiMeZjZDvQ3JuEZd' }}
    steps:
      - name: Checkout complete repository history at selected commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify selected commit is the complete main snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          test -f package-lock.json
          test -f vercel.json

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run production validation on this exact deployment commit
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          set -euo pipefail
          npm ci
          npm run preflight

      - name: Generate immutable release/change-set manifest
        run: node scripts/release-manifest.mjs

      - name: Upload release/change-set manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify Vercel deployment identity
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify pulled production project identity
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(project.orgId!==process.env.VERCEL_ORG_ID) throw new Error('Vercel org mismatch');
          if(project.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Vercel project mismatch');
          NODE
          echo "Project identity verified. Sensitive Vercel environment values are intentionally not pulled into GitHub."

      - name: Deploy validated commit for remote production build
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID")"
          case "$deployment_url" in
            https://*) ;;
            *) echo "::error::Vercel did not return a production deployment URL"; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Report deployed commit
        run: |
          echo "Production deployment completed for immutable commit $GITHUB_SHA."
          echo "Deployment: ${{ steps.deploy.outputs.url }}"
