name: Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v2-billing-production
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_W3fS0X03YCjNkD2BoqRj6Uld
      VERCEL_PROJECT_ID: prj_3ARdg4cRikU2OiMeZjZDvQ3JuEZd
      VERCEL_CLI_VERSION: 59.6.2
      SUPABASE_PROJECT_ID: bealqgenrcytjzjoikmk
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: primary
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://incendiarynetworks.cc/api/v1/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. This workflow will not access source, scan, build or deploy production."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Checkout complete repository history at selected commit
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify immutable production source
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git fetch origin main --prune
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          test -f package-lock.json
          test -f vercel.json
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('vercel.json','utf8'));
          if(config?.git?.deploymentEnabled!==false) {
            throw new Error('Production policy violation: automatic Vercel Git deployments must remain disabled');
          }
          NODE

      - name: Verify exact commit passed Full Scan
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api -H "Accept: application/vnd.github+json" "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?per_page=100")"
          scan="$(printf '%s' "$runs" | jq -c --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .head_branch == "main")] | sort_by(.created_at) | reverse | .[0] // empty')"
          if [ -z "$scan" ]; then
            echo "::error::Deploy blocked: no Full Scan workflow_dispatch run exists for exact commit $GITHUB_SHA."
            exit 1
          fi
          status="$(printf '%s' "$scan" | jq -r '.status // empty')"
          conclusion="$(printf '%s' "$scan" | jq -r '.conclusion // empty')"
          url="$(printf '%s' "$scan" | jq -r '.html_url // empty')"
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Deploy blocked: Full Scan for exact commit $GITHUB_SHA is $status/$conclusion."
            [ -n "$url" ] && echo "Full Scan: $url"
            exit 1
          fi
          echo "Reusing successful Full Scan for exact commit $GITHUB_SHA."
          [ -n "$url" ] && echo "Full Scan: $url"

      - name: Use Node 22
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve currently deployed production commit
        if: steps.profile.outputs.deploy == 'true'
        id: production_base
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1")"
          base_sha="$(printf '%s' "$response" | jq -r '.deployments[0].meta.githubCommitSha // empty')"
          if [ -z "$base_sha" ]; then
            echo "::error::Could not resolve the Git commit currently deployed to Vercel production."
            exit 1
          fi
          git cat-file -e "$base_sha^{commit}"
          relation="diverged"
          if [ "$base_sha" = "$GITHUB_SHA" ]; then
            relation="current"
          elif git merge-base --is-ancestor "$base_sha" "$GITHUB_SHA"; then
            relation="ancestor"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "relation=$relation" >> "$GITHUB_OUTPUT"
          echo "RELEASE_BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "Production base: $base_sha"
          echo "Selected main:   $GITHUB_SHA"
          echo "Relationship:    $relation"
          if [ "$relation" = "diverged" ]; then
            echo "::notice::Production was deployed from a retired non-main branch. Comparing its exact tree against current main for this migration deploy."
          fi
          echo "Main commits not contained in the current production commit:"
          git log --reverse --oneline "$base_sha..$GITHUB_SHA"

      - name: Verify complete pending change-set
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.production_base.outputs.base_sha }}"
          count="$(git rev-list --count "$base..$GITHUB_SHA")"
          echo "Main commits not contained in production: $count"
          if git diff --quiet "$base" "$GITHUB_SHA"; then
            echo "No source-tree changes are pending; production content already matches selected main."
          else
            echo "Changed files between current production tree and selected main:"
            git diff --name-status "$base" "$GITHUB_SHA"
          fi

      - name: Generate cumulative production change-set manifest
        if: steps.profile.outputs.deploy == 'true'
        env:
          RELEASE_BASE_SHA: ${{ steps.production_base.outputs.base_sha }}
        run: node scripts/release-manifest.mjs

      - name: Upload release/change-set manifest
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Verify production deployment identity
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          test -n "$VERCEL_CLI_VERSION"

      - name: Install pinned Vercel CLI
        if: steps.profile.outputs.deploy == 'true'
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Pull production configuration without deploying
        if: steps.profile.outputs.deploy == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Resolve authoritative Supabase public build configuration
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "bealqgenrcytjzjoikmk"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys")"
          if [ "$status" != "200" ]; then
            echo "::error::Could not read API keys for the confirmed Billing Store Supabase project (HTTP $status)."
            exit 1
          fi

          public_key="$(node - "$response_file" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(rows)) throw new Error('Unexpected Supabase API-key response');
          const row=rows.find(x=>String(x?.name||'').toLowerCase()==='anon')
            || rows.find(x=>String(x?.type||'').toLowerCase()==='publishable')
            || rows.find(x=>String(x?.name||'').toLowerCase().includes('publishable'));
          const key=String(row?.api_key||row?.key||'').trim();
          if(!key) throw new Error('No public/anon API key found for Billing Store Supabase project');
          process.stdout.write(key);
          NODE
          )"

          echo "::add-mask::$public_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$public_key" >> "$GITHUB_ENV"

          node -e 'const u=new URL(process.argv[1]); if(u.protocol!=="https:") process.exit(1)' "https://$SUPABASE_PROJECT_ID.supabase.co"
          echo "Resolved public build configuration from confirmed Supabase project $SUPABASE_PROJECT_ID."

      - name: Verify pulled production project identity
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(project.orgId!==process.env.VERCEL_ORG_ID) throw new Error('Vercel org mismatch');
          if(project.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Vercel project mismatch');
          NODE

      - name: Build exact production artifact without deploying
        if: steps.profile.outputs.deploy == 'true'
        run: vercel build --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify prebuilt production artifact locally
        if: steps.profile.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/functions -o -d .vercel/output/static
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('.vercel/output/config.json','utf8'));
          if(Number(config.version)!==3) throw new Error('Unexpected Vercel Build Output API version');
          NODE

      - name: Report validated production change-set before deployment
        if: steps.profile.outputs.deploy == 'true'
        run: |
          base="${{ steps.production_base.outputs.base_sha }}"
          count="$(git rev-list --count "$base..$GITHUB_SHA")"
          echo "All production checks passed; Vercel deployment is the final step."
          echo "Previous production commit: $base"
          echo "Previous relationship:      ${{ steps.production_base.outputs.relation }}"
          echo "New production commit:      $GITHUB_SHA"
          echo "Main commits not in prior production: $count"

      - name: Deploy exact validated prebuilt artifact to Vercel production
        if: steps.profile.outputs.deploy == 'true'
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --yes \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --meta "githubCommitSha=$GITHUB_SHA" \
            --meta "githubCommitRef=main" \
            --meta "githubOrg=lucaskerim123" \
            --meta "githubRepo=V2_Billing_Store")"
          case "$deployment_url" in
            https://*) ;;
            *) echo "::error::Vercel did not return a production deployment URL"; exit 1 ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment completed."
          echo "Commit: $GITHUB_SHA"
          echo "Deployment: $deployment_url"
