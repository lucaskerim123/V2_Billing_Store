name: Quick Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-billing-quick
  # Never cancel a deployment after Vercel may already have accepted it. A cancelled
  # run still consumes a deployment, and the replacement run would create another.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_W3fS0X03YCjNkD2BoqRj6Uld
      VERCEL_PROJECT_ID: prj_3ARdg4cRikU2OiMeZjZDvQ3JuEZd
      VERCEL_CLI_VERSION: 59.23.1
      SUPABASE_PROJECT_ID: hdwijbdxmpwlltnfrbsc
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: primary
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://dev.incendiarynetworks.cc/api/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. This workflow will not access source, scan, build or deploy production."
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Resolve main branch
        if: steps.profile.outputs.deploy == 'true'
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          echo "name=main" >> "$GITHUB_OUTPUT"
          echo "TARGET_BRANCH=main" >> "$GITHUB_ENV"
          echo "Quick Deploy source is fixed to main."

      - name: Checkout selected branch
        if: steps.profile.outputs.deploy == 'true'
        uses: actions/checkout@v6
        with:
          ref: refs/heads/${{ steps.branch.outputs.name }}
          fetch-depth: 1

      - name: Verify quick-deploy source
        if: steps.profile.outputs.deploy == 'true'
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

          actual_branch="$(git branch --show-current)"
          test "$actual_branch" = "$TARGET_BRANCH"

          commit="$(git rev-parse HEAD)"
          remote_commit="$(git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test -n "$remote_commit"
          test "$commit" = "$remote_commit"

          echo "branch=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Quick Deploy source: $TARGET_BRANCH @ $commit"

      - name: Reuse an existing production deployment for this commit
        if: steps.profile.outputs.deploy == 'true'
        id: existing
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=100&teamId=$VERCEL_ORG_ID")"
          if [ "$status" != "200" ]; then
            echo "::error::Could not inspect existing Vercel production deployments (HTTP $status)."
            cat "$response_file"
            exit 1
          fi
          existing_url="$(node - "$response_file" "$SOURCE_COMMIT" <<'NODE'
          const fs=require('fs');
          const [file,sha]=process.argv.slice(2);
          const body=JSON.parse(fs.readFileSync(file,'utf8'));
          const rows=Array.isArray(body.deployments)?body.deployments:[];
          const match=rows.find((row)=>{
            const meta=row&&row.meta&&typeof row.meta==='object'?row.meta:{};
            const state=String(row?.readyState||row?.state||'').toUpperCase();
            return state==='READY' && String(meta.githubCommitSha||'')===sha && row?.url;
          });
          if(match)process.stdout.write(String(match.url).startsWith('http')?String(match.url):'https://'+String(match.url));
          NODE
          )"
          if [ -n "$existing_url" ]; then
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "url=$existing_url" >> "$GITHUB_OUTPUT"
            echo "Existing READY production deployment already represents $SOURCE_COMMIT: $existing_url"
          else
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "No READY production deployment found for $SOURCE_COMMIT; a new deployment is required."
          fi

      - name: Install pinned Vercel CLI
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse != 'true') }}
        run: |
          npm install --global "vercel@$VERCEL_CLI_VERSION"
          vercel --version

      - name: Pull production configuration without deploying
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse != 'true') }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Resolve authoritative Supabase public build configuration
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "hdwijbdxmpwlltnfrbsc"

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Accept: application/json" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys")"
          if [ "$status" != "200" ]; then
            echo "::error::Could not read API keys for the confirmed Billing Store Supabase project (HTTP $status)."
            exit 1
          fi

          public_key="$(node - "$response_file" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(rows)) throw new Error('Unexpected Supabase API-key response');
          const row=rows.find(x=>String(x?.name||'').toLowerCase()==='anon')
            || rows.find(x=>String(x?.type||'').toLowerCase()==='publishable')
            || rows.find(x=>String(x?.name||'').toLowerCase().includes('publishable'));
          const key=String(row?.api_key||row?.key||'').trim();
          if(!key) throw new Error('No public/anon API key found for Billing Store Supabase project');
          process.stdout.write(key);
          NODE
          )"

          echo "::add-mask::$public_key"
          echo "NEXT_PUBLIC_SUPABASE_URL=https://$SUPABASE_PROJECT_ID.supabase.co" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$public_key" >> "$GITHUB_ENV"

          node -e 'const u=new URL(process.argv[1]); if(u.protocol!=="https:") process.exit(1)' "https://$SUPABASE_PROJECT_ID.supabase.co"
          echo "Resolved public build configuration from confirmed Supabase project $SUPABASE_PROJECT_ID."

      - name: Verify pulled production project identity
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/project.json
          node - <<'NODE'
          const fs=require('fs');
          const project=JSON.parse(fs.readFileSync('.vercel/project.json','utf8'));
          if(project.orgId!==process.env.VERCEL_ORG_ID) throw new Error('Vercel org mismatch');
          if(project.projectId!==process.env.VERCEL_PROJECT_ID) throw new Error('Vercel project mismatch');
          NODE

      - name: Build quick-deploy artifact without deploying
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse != 'true') }}
        run: vercel build --prod --yes --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID"

      - name: Verify quick-deploy artifact locally
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/config.json
          test -d .vercel/output/functions -o -d .vercel/output/static
          node - <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('.vercel/output/config.json','utf8'));
          if(Number(config.version)!==3) throw new Error('Unexpected Vercel Build Output API version');
          NODE

      - name: Report reused production deployment
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse == 'true') }}
        run: |
          echo "Quick deployment not required."
          echo "Branch: ${{ steps.source.outputs.branch }}"
          echo "Commit: ${{ steps.source.outputs.commit }}"
          echo "Deployment: ${{ steps.existing.outputs.url }}"
          echo "Reused existing deployment: true"

      - name: Deploy validated quick artifact to production
        id: deploy
        if: ${{ steps.profile.outputs.deploy == 'true' && (steps.existing.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --archive=tgz --prod --yes \
            --token="$VERCEL_TOKEN" \
            --scope="$VERCEL_ORG_ID" \
            --meta "githubCommitSha=${{ steps.source.outputs.commit }}" \
            --meta "githubCommitRef=${{ steps.source.outputs.branch }}" \
            --meta "githubOrg=lucaskerim123" \
            --meta "githubRepo=V2_Billing_Store")"
          case "$deployment_url" in
            https://*) ;;
            *)
              echo "::error::Vercel did not return a production deployment URL"
              exit 1
              ;;
          esac
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Quick deployment completed."
          echo "Branch: ${{ steps.source.outputs.branch }}"
          echo "Commit: ${{ steps.source.outputs.commit }}"
          echo "Deployment: $deployment_url"
