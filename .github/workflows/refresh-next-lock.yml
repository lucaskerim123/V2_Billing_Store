name: Refresh patched Next lockfile
on:
  push:
    branches:
      - fix/orbitfs-update-release-integrity
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/orbitfs-update-release-integrity
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install next@16.3.7 --save-exact --ignore-scripts
      - run: npm install eslint-config-next@16.3.7 --save-dev --save-exact --ignore-scripts
      - name: Commit patched dependency lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Patch Next.js security dependency"
          git push origin HEAD:fix/orbitfs-update-release-integrity
