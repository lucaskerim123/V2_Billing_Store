name: Supabase Migrations
on:
  push:
    branches: [main]
    paths:
      - 'database/migrations/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: billing-store-supabase-production
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_ID: bealqgenrcytjzjoikmk
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout complete migration history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare immutable migration set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .orbitfs-supabase
          (cd .orbitfs-supabase && supabase init)
          node scripts/prepare-supabase-migrations.mjs .orbitfs-supabase/supabase/migrations
      - name: Reject edits to existing migration history
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then exit 0; fi
          changes="$(git diff --name-status "$before" "$GITHUB_SHA" -- 'database/migrations/*.sql' || true)"
          echo "$changes"
          if echo "$changes" | awk '$1 ~ /^(M|D|R)/ {bad=1} END {exit bad?0:1}'; then
            echo "::error::Existing migration files are immutable. Add a new migration instead."
            exit 1
          fi
      - name: Detect pending migrations
        id: pending
        shell: bash
        run: |
          count="$(node -e "const r=require('./.orbitfs-supabase/report.json');process.stdout.write(String(r.pending_count||0))")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending migrations: $count"
      - name: Verify exact production credentials
        if: ${{ steps.pending.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "bealqgenrcytjzjoikmk"

      - name: Apply pending migrations through Supabase Management API
        if: ${{ steps.pending.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-supabase-migrations-api.mjs .orbitfs-supabase/report.json

      - name: Verify migration history through Supabase Management API
        if: ${{ steps.pending.outputs.count != '0' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ref=process.env.SUPABASE_PROJECT_ID;
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          const response=await fetch(`https://api.supabase.com/v1/projects/${encodeURIComponent(ref)}/database/migrations`,{
            headers:{authorization:`Bearer ${token}`,accept:"application/json"}
          });
          const text=await response.text();
          if(!response.ok)throw new Error(`Migration history check failed (${response.status}): ${text}`);
          const body=JSON.parse(text);
          const rows=Array.isArray(body)?body:Array.isArray(body?.migrations)?body.migrations:[];
          console.log(`Remote migration count: ${rows.length}`);
          NODE
      - name: No database changes required
        if: ${{ steps.pending.outputs.count == '0' }}
        run: echo "No pending database migrations."
