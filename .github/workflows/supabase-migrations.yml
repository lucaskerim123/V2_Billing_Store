name: Supabase Migrations
# Database production migrations are explicit manual operations.
# Push CI and Vercel release workflows must not mutate production database.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: billing-store-supabase-production
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_PROJECT_ID: bealqgenrcytjzjoikmk
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check active GitHub profile
        id: profile
        shell: bash
        env:
          EXPECTED_GITHUB_PROFILE: primary
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 https://dev.incendiarynetworks.cc/api/github-profile)"
          active="$(node -e 'const x=JSON.parse(process.argv[1]); process.stdout.write(String(x.profile||""))' "$response")"
          echo "Active GitHub profile: $active"
          echo "Expected for this repository: $EXPECTED_GITHUB_PROFILE"
          if [ "$active" != "$EXPECTED_GITHUB_PROFILE" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Inactive GitHub profile. Remaining workflow steps are disabled."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Checkout complete migration history
        if: steps.profile.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node 22
        if: steps.profile.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Supabase CLI
        if: steps.profile.outputs.run == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare immutable migration set
        if: steps.profile.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .orbitfs-supabase
          (cd .orbitfs-supabase && supabase init)
          node scripts/prepare-supabase-migrations.mjs .orbitfs-supabase/supabase/migrations
      - name: Detect pending migrations
        if: steps.profile.outputs.run == 'true'
        id: pending
        shell: bash
        run: |
          count="$(node -e "const r=require('./.orbitfs-supabase/report.json');process.stdout.write(String(r.pending_count||0))")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending migrations: $count"
      - name: Verify exact production credentials
        if: ${{ steps.profile.outputs.run == 'true' && (steps.pending.outputs.count != '0') }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret"; exit 1; }
          test "$SUPABASE_PROJECT_ID" = "bealqgenrcytjzjoikmk"

      - name: Apply pending migrations through Supabase Management API
        if: ${{ steps.profile.outputs.run == 'true' && (steps.pending.outputs.count != '0') }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-supabase-migrations-api.mjs .orbitfs-supabase/report.json

      - name: Verify migration history through Supabase Management API
        if: ${{ steps.profile.outputs.run == 'true' && (steps.pending.outputs.count != '0') }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ref=process.env.SUPABASE_PROJECT_ID;
          const token=process.env.SUPABASE_ACCESS_TOKEN;
          const response=await fetch(`https://api.supabase.com/v1/projects/${encodeURIComponent(ref)}/database/migrations`,{
            headers:{authorization:`Bearer ${token}`,accept:"application/json"}
          });
          const text=await response.text();
          if(!response.ok)throw new Error(`Migration history check failed (${response.status}): ${text}`);
          const body=JSON.parse(text);
          const rows=Array.isArray(body)?body:Array.isArray(body?.migrations)?body.migrations:[];
          console.log(`Remote migration count: ${rows.length}`);
          NODE
      - name: No database changes required
        if: ${{ steps.profile.outputs.run == 'true' && (steps.pending.outputs.count == '0') }}
        run: echo "No pending database migrations."
